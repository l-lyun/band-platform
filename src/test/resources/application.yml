spring:
  datasource:
    url: jdbc:h2:mem:band_platform_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

security:
  jwt:
    issuer: band-platform
    secret: band-platform-test-secret-key-change-me
    access-token-ttl-seconds: 1800
    refresh-token-ttl-seconds: 1209600
    refresh-cookie-name: refreshToken
    refresh-cookie-secure: false
